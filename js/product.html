<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #nav {
        background-color: rgba(52, 51, 51, 0.592);
        margin-bottom: 20px;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        /* margin: 20px; */
      }

      .card {
        width: 250px;
        background-color: #fff;
        padding: 18px;
        border-radius: 14px;
        box-shadow: 0px 4px 8px rgb(96, 93, 93);
        text-align: center;
      }

      .card img {
        width: 100%;
        height: 170px;
        border-radius: 5px;
      }

      .card:hover {
        transform: translateY(-4px);
        transition: transform 2s;
        cursor: pointer;
      }

      .card h3 {
        color: rgba(80, 78, 78, 0.684);
      }

      .card h4 {
        color: green;
      }
      .card p {
        font-weight: 500;
        color: rgba(128, 128, 128, 0.801);
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <section id="nav">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-12">
            <nav class="navbar navbar-expand-lg">
              <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button
                  class="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarSupportedContent"
                  aria-controls="navbarSupportedContent"
                  aria-expanded="false"
                  aria-label="Toggle navigation"
                >
                  <span class="navbar-toggler-icon"></span>
                </button>
                <div
                  class="collapse navbar-collapse"
                  id="navbarSupportedContent"
                >
                  <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                      <a class="nav-link active" aria-current="page" href="#"
                        >Home</a
                      >
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                      <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                      >
                        Dropdown
                      </a>
                      <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li>
                          <a class="dropdown-item" href="#">Another action</a>
                        </li>
                        <li><hr class="dropdown-divider" /></li>
                        <li>
                          <a class="dropdown-item" href="#"
                            >Something else here</a
                          >
                        </li>
                      </ul>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link disabled">Disabled</a>
                    </li>
                  </ul>
                  <form class="d-flex" role="search">
                    <input
                      class="form-control me-2"
                      type="search"
                      placeholder="Search"
                      aria-label="Search"
                    />
                    <button class="btn btn-danger" type="submit">Search</button>
                  </form>
                </div>
              </div>
            </nav>
          </div>
        </div>
      </div>
    </section>

    <div class="container" id="product_container"></div>

    <script>
      async function dataFetch() {
        try {
          const response = await fetch("https://dummyjson.com/products");
          const data = await response.json();
          console.log(data);
          displayProduct(data.products);
        } catch (error) {
          console.log(error);
        }
      }

      function displayProduct(value) {
        let html = "";
        value.forEach((item, index) => {
          html += `
                         <div class="card">
                           <img src=${item.images[0]} alt="ProductImage" />
                           <h3>${item.title}</h3>
                           <h4>${item.price} $</h4>
                           <p>${item.description}</p>
                         </div>
            `;
        });

        document.getElementById("product_container").innerHTML = html;
      }

      dataFetch();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
